# Netlify configuration — DK Quality Construction
# Response headers (security + caching) live in src/static/_headers and redirects in
# src/static/_redirects; both are copied into dist/ so they also apply to manual deploys.

[build]
  command = "node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Non-production deploys (deploy previews, branch deploys) are built with noindex and a
# Disallow robots.txt automatically — see site.config.mjs. Production needs SITE_URL set.
